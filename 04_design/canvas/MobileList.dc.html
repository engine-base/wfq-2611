<div style="width: 100%; max-width: 390px; height: 844px; background: #FFFFFF; display: flex; flex-direction: column; overflow: hidden; position: relative">

 <div style="display: flex; align-items: center; gap: 8px; padding: 14px 16px 6px">
  <h1 style="font-size: 18px; margin: 0">チケット</h1><span style="color: #4A5563">12 件</span>
 </div>
 <div role="tablist" style="display: flex; gap: 2px; padding: 0 16px; border-bottom: 1px solid #DDE2E9; overflow-x: auto">
  <button type="button" role="tab" aria-selected="true" style="padding: 8px 10px; border: 0; border-bottom: 2px solid #22345C; background: transparent; color: #22345C; font-weight: 500; font-size: 13px; white-space: nowrap">自分に関わるもの</button>
  <a href="Overview.dc.html" style="padding: 8px 10px; border: 0; border-bottom: 2px solid transparent; background: transparent; color: #4A5563; font-size: 13px; white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; box-sizing: border-box; cursor: pointer">概要</a>
  <a href="List.dc.html" style="padding: 8px 10px; border: 0; border-bottom: 2px solid transparent; background: transparent; color: #4A5563; font-size: 13px; white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; box-sizing: border-box; cursor: pointer">一覧</a>
  <a href="Calendar.dc.html" style="padding: 8px 10px; border: 0; border-bottom: 2px solid transparent; background: transparent; color: #4A5563; font-size: 13px; white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; box-sizing: border-box; cursor: pointer">カレンダー</a>
 </div>
 <div style="display: flex; gap: 8px; padding: 10px 16px; overflow-x: auto">
  <button type="button" style="flex: none; height: 30px; border: 1px solid #DCE4F2; background: #DCE4F2; color: #101C33; border-radius: 9999px; padding: 0 10px; font-size: 13px">すべて 12</button>
  <button type="button" style="flex: none; height: 30px; border: 1px solid #DDE2E9; background: #FFFFFF; color: #4A5563; border-radius: 9999px; padding: 0 10px; font-size: 13px">自分が担当 7</button>
  <button type="button" style="flex: none; height: 30px; border: 1px solid #DDE2E9; background: #FFFFFF; color: #4A5563; border-radius: 9999px; padding: 0 10px; font-size: 13px">AI が動いている 3</button>
 </div>
 <div style="flex: 1; overflow: auto; border-top: 1px solid #DDE2E9">
  <div style="background: #F7F8FA; padding: 6px 16px; font-size: 12px; color: #4A5563; font-weight: 500">期限切れ・今日</div>
  <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
   <a href="MobileDetail.dc.html" style="display: flex; flex-direction: column; gap: 2px; padding: 10px 16px; border-bottom: 1px solid #EDF0F4; color: #131B27; text-decoration: none; min-height: 44px">
    <b style="font-weight: 500">{{r.title}}</b>
    <span style="display: flex; gap: 8px; align-items: center; font-size: 12px; color: #4A5563"><span>{{r.key}}</span><span style="{{r.stStyle}}">{{r.state}}</span><span>{{r.doer}}</span><span style="{{r.dueStyle}}">{{r.due}}</span></span>
   </a>
  </sc-for>
 </div>

ve; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; color: #4A5563; text-decoration: none; "><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg>メニュー</a></nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var S = { "承認待ち": "background:#FCEBD5;color:#7A4A05", "実行中": "background:#DBEAFE;color:#1e40af", "確認中": "background:#E9E0F5;color:#33235C", "作業中": "background:#EDF0F4;color:#4A5563", "未着手": "background:#EDF0F4;color:#4A5563", "完了": "background:#DCFCE7;color:#2E5B26" };
    var mk = function (k, t, st, doer, due, late) {
      return { key: k, title: t, state: st, doer: doer, due: due, stStyle: "border-radius:9999px;padding:1px 8px;" + S[st], dueStyle: late ? "color:#B91C1C;font-weight:500" : "" };
    };
    return { rows: [
      mk("EG-128", "セイコー様へ 11月分の請求書を送る", "承認待ち", "高本のAI", "11/01", true),
      mk("EG-127", "発注ナビ 新着案件に応募文を出す", "実行中", "高本のAI", "11/02", false),
      mk("EG-121", "京蟻 見積の金額を確認する", "確認中", "高本", "11/02", false),
      mk("EG-119", "問い合わせ（山田様）に一次返信する", "作業中", "佐藤", "11/05", false),
      mk("EG-115", "受託開発 定例の議事と決定を残す", "未着手", "高本", "11/06", false),
      mk("EG-112", "入金の照合（10月分）", "完了", "高本のAI", "11/07", false)
    ] };
  }
}
</script>
